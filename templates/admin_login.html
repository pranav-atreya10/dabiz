<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Requirements Studio</title>
  {% include "_styles.html" %}
  <style>
    .wrap { min-height: calc(100vh - 64px); display: grid; place-items: center; padding: 32px 16px; }
    .login { width: 100%; max-width: 440px; padding: 40px 32px; }
    h1 { font-size: 40px; font-weight: 500; letter-spacing: -.03em; line-height: 1.1; margin: 28px 0 10px; }
    .lead { font-size: 17px; margin: 0 0 28px; }
    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
    .btn { width: 100%; margin-top: 18px; }
    .note { margin: 24px 0 0; font-size: 13px; color: var(--faint); text-align: center; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}">{% include "_logo.html" %}<span>Requirements Studio</span></a>
  </header>
  <main class="wrap">
    <form class="card login" method="post" action="{{ url_for('admin_login') }}">
      <div class="icon-tile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <rect x="5" y="10.5" width="14" height="10" rx="3"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>
        </svg>
      </div>
      <h1>Admin</h1>
      <p class="lead muted">Manage orgs, their sign-in codes, and their Azure DevOps connections.</p>
      <label for="password">Admin password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus {% if locked %}disabled{% endif %}>
      <p class="error">{{ error or "" }}</p>
      <button class="btn btn-primary" type="submit" {% if locked %}disabled{% endif %}>Continue <span class="arrow">→</span></button>
      <p class="note">Looking for the app? <a href="{{ url_for('login') }}" style="color:inherit">Sign in with your org code</a>.</p>
    </form>
  </main>
</body>
</html>
