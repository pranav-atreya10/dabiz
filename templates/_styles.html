<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Light by default; dark when the visitor's device or browser is set to dark. */
  :root {
    color-scheme: light dark;
    --bg: #f5f7fb; --surface: #ffffff; --surface-2: #eef2f8; --raised: #e6ecf5; --hover: #f3f6fb;
    --text: #0b132b; --text-2: #3a506b; --text-3: #1c2541; --muted: #55657d; --faint: #8592a6;
    --border: #e1e7f0; --border-strong: #cfd8e5; --focus: #5bc0de;
    --accent: #d97706; --accent-soft: #fdf1e2; --accent-line: #5bc0de;
    --danger: #c62828; --success: #1f9d55; --warn-bg: #fdf1e2; --warn-text: #8a4b05;
    --topbar-bg: rgba(255,255,255,.85); --topbar-border: #e6ecf5;
    --shadow: 0 1px 2px rgba(11,19,43,.04), 0 10px 30px rgba(11,19,43,.07);
    --btn-bg: linear-gradient(180deg, #f59e0b 0%, #d97706 55%, #b45309 100%); --btn-fg: #fff;
    --btn-shadow: 0 6px 16px rgba(217,119,6,.28), inset 0 1px 0 rgba(255,255,255,.28);
    --btn-2-bg: #ffffff; --btn-2-fg: #0b132b; --btn-2-border: #cfd8e5; --btn-2-hover: #f3f6fb;
    --q-head: #eef2f8; --q-body: #ffffff; --q-radio: #a9b5c6;
    /* Gradient artwork: navy to sky, with an amber sphere */
    --art-bg: linear-gradient(165deg, #e9f2fa 0%, #a8d8ea 30%, #3a506b 68%, #0b132b 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b132b; --surface: #1c2541; --surface-2: #141c36; --raised: #26314f; --hover: #222c4a;
      --text: #f1f4fa; --text-2: #c3cddd; --text-3: #dce3ee; --muted: #9aa8bf; --faint: #6c7a93;
      --border: #2a3656; --border-strong: #3a506b; --focus: #5bc0de;
      --accent: #f59e0b; --accent-soft: #3a2a12; --accent-line: #5bc0de;
      --danger: #ff8a80; --success: #7ee2a8; --warn-bg: #3a2a12; --warn-text: #f4d6b0;
      --topbar-bg: rgba(11,19,43,.85); --topbar-border: #1c2541;
      --shadow: 0 10px 30px rgba(0,0,0,.25);
      --btn-shadow: 0 6px 18px rgba(245,158,11,.25), inset 0 1px 0 rgba(255,255,255,.28);
      --btn-2-bg: #26314f; --btn-2-fg: #f1f4fa; --btn-2-border: transparent; --btn-2-hover: #2f3b5c;
      --q-head: #26314f; --q-body: #1c2541; --q-radio: #6c7a93;
      --art-bg: linear-gradient(165deg, #3a506b 0%, #1c2541 45%, #0b132b 100%);
    }
  }
  /* Gradient artwork (home page): glassy stripes plus a glowing amber sphere. */
  .art { position: relative; overflow: hidden; isolation: isolate; background: var(--art-bg); }
  .art::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.28) 0 1.5px, rgba(255,255,255,0) 1.5px 26px),
      linear-gradient(90deg, rgba(91,192,222,0) 40%, rgba(91,192,222,.35) 75%, rgba(244,214,176,.25) 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0 42%, #000 72%);
    mask-image: linear-gradient(90deg, transparent 0 42%, #000 72%);
  }
  .art::after {
    content: ""; position: absolute; z-index: -2; border-radius: 50%;
    width: var(--ss, 70%); aspect-ratio: 1; left: var(--sx, 52%); top: var(--sy, 18%);
    background: radial-gradient(circle at 32% 28%, #fff1d9 0%, #f4d6b0 10%, #f59e0b 24%, #d97706 36%, #3a506b 64%, #0b132b 90%);
    box-shadow: 0 0 120px rgba(217,119,6,.35), inset -30px -40px 80px rgba(11,19,43,.55);
    animation: orbit 18s ease-in-out infinite alternate;
  }
  @keyframes orbit {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-6%, 4%) scale(1.05); }
    100% { transform: translate(4%, -3%) scale(.98); }
  }
  @media (prefers-reduced-motion: reduce) { .art::after { animation: none; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.6 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    height: 64px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; border-bottom: 1px solid var(--topbar-border); background: var(--topbar-bg);
    -webkit-backdrop-filter: saturate(180%) blur(12px); backdrop-filter: saturate(180%) blur(12px);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; letter-spacing: -.02em; }
  .brand svg { flex: none; }
  @media (max-width: 640px) {
    .topbar { padding: 0 14px; gap: 8px; }
    .topbar .btn-sm { padding: 0 12px; }
    .topbar nav a, .topbar .who a { padding-left: 6px !important; padding-right: 6px !important; }
  }
  a.brand { color: inherit; text-decoration: none; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    height: 48px; padding: 0 26px; border-radius: 999px; border: 1px solid transparent;
    font: inherit; font-weight: 600; cursor: pointer; transition: background .15s, opacity .15s, transform .15s;
    white-space: nowrap; text-decoration: none;
  }
  .btn-primary { background: var(--btn-bg); color: var(--btn-fg); box-shadow: var(--btn-shadow); }
  .btn-primary:hover:not(:disabled) { opacity: .9; }
  .btn-primary:active:not(:disabled) { transform: translateY(1px); }
  .btn-secondary { background: var(--btn-2-bg); color: var(--btn-2-fg); border-color: var(--btn-2-border); }
  .btn-secondary:hover:not(:disabled) { background: var(--btn-2-hover); }
  .btn-outline { background: transparent; color: var(--text); border-color: var(--border-strong); }
  .btn-outline:hover:not(:disabled) { background: var(--hover); }
  .btn-sm { height: 36px; padding: 0 16px; font-size: 14px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn .arrow { font-size: 18px; line-height: 1; }
  .spinner {
    width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  input[type=password], input[type=text], input[type=url], select, textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border-strong); border-radius: 14px; padding: 14px 16px;
    transition: border-color .15s;
  }
  input[type=password]:focus, input[type=text]:focus, input[type=url]:focus, select:focus, textarea:focus { outline: none; border-color: var(--focus); }
  textarea { min-height: 88px; resize: vertical; }
  ::placeholder { color: var(--faint); }
  .error { color: var(--danger); margin: 10px 0 0; min-height: 1em; font-size: 14px; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow); }
  .icon-tile {
    width: 52px; height: 52px; border-radius: 14px; background: var(--surface-2);
    display: grid; place-items: center; color: var(--text); border: 1px solid var(--border);
  }
  /* "—— Label" section eyebrow */
  .eyebrow { display: inline-flex; align-items: center; gap: 14px; color: var(--muted); font-size: 15px; font-weight: 500; }
  .eyebrow::before { content: ""; width: 32px; height: 1.5px; background: var(--accent-line); }
</style>
