<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #000000; --surface: #1c1c1c; --surface-2: #141414; --raised: #2a2a2a;
    --text: #f2f2f2; --muted: #a1a1a1; --faint: #6b6b6b; --border: #2b2b2b; --border-strong: #3a3a3a;
    --danger: #ff8a80; --success: #7ee2a8; --warn-bg: #2a2410; --warn-text: #f3d27a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.6 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    height: 64px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; border-bottom: 1px solid #1a1a1a; background: var(--bg);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 18px; letter-spacing: -.01em; }
  .brand svg { flex: none; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    height: 48px; padding: 0 26px; border-radius: 999px; border: 1px solid transparent;
    font: inherit; font-weight: 500; cursor: pointer; transition: background .15s, opacity .15s;
    white-space: nowrap;
  }
  .btn-primary { background: #f2f2f2; color: #0a0a0a; }
  .btn-primary:hover:not(:disabled) { background: #ffffff; }
  .btn-secondary { background: var(--raised); color: var(--text); }
  .btn-secondary:hover:not(:disabled) { background: #343434; }
  .btn-outline { background: transparent; color: var(--text); border-color: var(--border-strong); }
  .btn-outline:hover:not(:disabled) { background: #161616; }
  .btn-sm { height: 36px; padding: 0 16px; font-size: 14px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn .arrow { font-size: 18px; line-height: 1; }
  .spinner {
    width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  input[type=password], textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border-strong); border-radius: 14px; padding: 14px 16px;
    transition: border-color .15s;
  }
  input[type=password]:focus, textarea:focus { outline: none; border-color: #8a8a8a; }
  textarea { min-height: 88px; resize: vertical; }
  ::placeholder { color: var(--faint); }
  .error { color: var(--danger); margin: 10px 0 0; min-height: 1em; font-size: 14px; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; }
  .icon-tile {
    width: 52px; height: 52px; border-radius: 14px; background: var(--surface-2);
    display: grid; place-items: center; color: var(--text);
  }
</style>
